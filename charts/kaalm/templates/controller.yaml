{{- include "kaalm.replicaFloor" .Values.controller.replicas -}}
{{/*
The controller Deployment, Service, and PodDisruptionBudget. Two replicas with
leader election: the leader reconciles, the standby keeps the activator
endpoint reachable across voluntary disruptions (the activator handler runs on
every replica). See docs/src/operations/deployment.md.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaalm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaalm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kaalm
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "kaalm.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kaalm-controller
      securityContext:
        runAsNonRoot: true
      # Spread the two replicas across nodes so a single node loss cannot take
      # both, which would surface as controller_unavailable 504s on wake.
      # Preferred (not required) so the chart still schedules on single-node
      # dev clusters; on multi-node clusters the scheduler spreads them. The
      # PDB (minAvailable 1) is what guards against simultaneous voluntary
      # eviction regardless.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kaalm
                    app.kubernetes.io/component: controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: manager
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            - --dns-namespace-labels={{ include "kaalm.labelList" .Values.controller.networkPolicy.dnsSelector.namespaceLabels }}
            - --dns-pod-labels={{ include "kaalm.labelList" .Values.controller.networkPolicy.dnsSelector.podLabels }}
            - --controller-tls-cert=/var/run/kaalm/tls.crt
            - --controller-tls-key=/var/run/kaalm/tls.key
            - --controller-tls-ca=/var/run/kaalm/ca.crt
            - --activator-addr=:9443
            - --webhook-cert-path=/var/run/kaalm
            - --webhook-port=9444
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --cert-duration={{ .Values.controller.certificate.duration }}
            - --cert-renew-before={{ .Values.controller.certificate.renewBefore }}
            - --zap-encoder=json
            - --zap-log-level={{ .Values.controller.logLevel }}
            - --client-qps={{ .Values.controller.client.qps }}
            - --client-burst={{ .Values.controller.client.burst }}
            {{- /* The ToolProvider probe reads what the broker reads, including
                 the gateway's fallback to the LLM body cap when the MCP cap
                 is 0. */}}
            - --mcp-max-body-bytes={{ include "kaalm.bytes" (.Values.gateway.mcpMaxBodyBytes | default .Values.gateway.maxLLMRequestBodyBytes) }}
            {{- if .Values.controller.pprofPort }}
            - --pprof-bind-address=:{{ .Values.controller.pprofPort }}
            {{- end }}
            {{- /* Provider health probes trust what the gateway's forwarding
                 path trusts (gateway.trustClusterCAForUpstream and
                 gateway.upstreamCA). The deprecated controller values add to
                 the same additive pool so older values files keep working. */}}
            {{- $probeCAs := list }}
            {{- if or .Values.gateway.trustClusterCAForUpstream .Values.controller.trustClusterCAForProbes }}
            {{- $probeCAs = append $probeCAs "/var/run/kaalm/ca.crt" }}
            {{- end }}
            {{- if .Values.gateway.upstreamCA.configMap }}
            {{- $probeCAs = append $probeCAs "/var/run/kaalm/upstream-ca.crt" }}
            {{- end }}
            {{- if include "kaalm.controllerProbeCAProjected" . }}
            {{- $probeCAs = append $probeCAs "/var/run/kaalm/probe-ca.crt" }}
            {{- end }}
            {{- if $probeCAs }}
            - --probe-ca={{ join "," $probeCAs }}
            {{- end }}
            {{- with .Values.gateway.callbackUrl.allowlist }}
            - --callback-url-allowlist={{ join "," . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: activator
              containerPort: 9443
            - name: conversion
              containerPort: 9444
            - name: metrics
              containerPort: 8080
            {{- if .Values.controller.pprofPort }}
            - name: pprof
              containerPort: {{ .Values.controller.pprofPort }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kaalm-tls
              mountPath: /var/run/kaalm
              readOnly: true
      volumes:
        # The controller's own leaf cert plus the trust-manager-projected CA,
        # combined so a rotation of either is picked up by the file watch.
        - name: kaalm-tls
          projected:
            sources:
              - secret:
                  name: kaalm-controller-tls
                  items:
                    - { key: tls.crt, path: tls.crt }
                    - { key: tls.key, path: tls.key }
              - configMap:
                  name: kaalm-ca-system
                  items:
                    - { key: ca.crt, path: ca.crt }
              {{- with .Values.gateway.upstreamCA.configMap }}
              # The gateway's upstream bundle, so provider health probes trust
              # what forwarding trusts. Same filename as in the gateway.
              - configMap:
                  name: {{ . }}
                  items:
                    - { key: {{ $.Values.gateway.upstreamCA.key }}, path: upstream-ca.crt }
              {{- end }}
              {{- if include "kaalm.controllerProbeCAProjected" . }}
              # Deprecated controller.probeCA, kept while values files move to
              # gateway.upstreamCA.
              - configMap:
                  name: {{ .Values.controller.probeCA.configMap }}
                  items:
                    - { key: {{ .Values.controller.probeCA.key }}, path: probe-ca.crt }
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kaalm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaalm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  selector:
    app.kubernetes.io/name: kaalm
    app.kubernetes.io/component: controller
  ports:
    - name: activator
      port: 9443
      targetPort: 9443
    # targetPort by name: during a rolling upgrade from a release without
    # the conversion listener, the old replicas declare no "conversion" port
    # and so are never endpoints for it; conversions only ever reach a
    # replica that can answer (design book, API Versioning, Upgrading in
    # Place).
    - name: conversion
      port: 9444
      targetPort: conversion
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kaalm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaalm.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kaalm
      app.kubernetes.io/component: controller
