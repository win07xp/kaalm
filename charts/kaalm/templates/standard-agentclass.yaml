{{/*
A default AgentClass platform teams can customize or delete. It leaves
runtimeClassName unset (the cluster default runtime), since stock clusters
define no RuntimeClass and pinning a named one would fail Pod admission
everywhere it is not installed. A sandboxed (gVisor) class is not a live
default for the same reason; the repository's
config/samples/kaalm_v1beta1_agentclass_sandboxed.yaml is one to start from.
See docs/src/operations/deployment.md.
*/}}
{{/*
The graduation window: while the AgentClass CRD still lists v1alpha1 in
status.storedVersions (the window between "kubectl apply -f crds/" and the
first post-upgrade start of the controller's storage migrator), helm could
neither read nor write this object: every such request converts through a
webhook that no replica serves yet. So the chart omits it for exactly that
upgrade; the keep policy below leaves the live object untouched, and the
next helm upgrade re-adopts it at v1beta1. Offline rendering (helm
template, lint) has no cluster to look up and includes it. See
docs/src/operations/api-versioning.md#upgrading-in-place.
*/}}
{{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "agentclasses.kaalm.io" }}
{{- $migrating := and $crd (has "v1alpha1" (($crd.status).storedVersions | default list)) }}
{{- if and .Values.standardAgentClass.enabled (not $migrating) }}
apiVersion: kaalm.io/v1beta1
kind: AgentClass
metadata:
  name: standard
  labels:
    {{- include "kaalm.labels" . | nindent 4 }}
  annotations:
    # helm keep: the class outlives an uninstall so running Agents are not
    # orphaned; platform teams delete it explicitly.
    helm.sh/resource-policy: keep
spec:
  image:
    pullPolicy: IfNotPresent
  resources:
    defaults:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { cpu: "1", memory: "2Gi" }
  # Storage is granted with a ceiling, because hibernation needs a volume to
  # hibernate onto (rule 29). pvcRetention is written out although it is the
  # schema default, so the rendered object matches what the apiserver stores.
  persistence:
    enabled: true
    defaultSizeGi: 5
    maxSizeGi: 50
    pvcRetention: Delete
  # The restricted Pod Security Standard, written out although it is also
  # the controller's default, so the rendered object shows what runs.
  security:
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
  {{- with .Values.standardAgentClass.allowedProviders }}
  allowedProviders:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- /* An empty or unset value omits the field: unset admits every
  namespace, and the CRD rejects an empty list (rule 47). */}}
  {{- with .Values.standardAgentClass.allowedNamespaces }}
  allowedNamespaces:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  # Durations in Go's canonical form (30m0s, not 30m): the controller's
  # reconcile-time defaulting re-serializes what it reads, and a value that
  # round-trips byte-identical never changes field ownership, so a
  # server-side-apply helm (v4) upgrades without conflicting with the
  # controller's manager over these fields.
  lifecycle:
    hibernationAllowed: true
    defaultIdleTimeout: 30m0s
    maxIdleTimeout: 24h0m0s
    defaultHibernationDelay: 30m0s
    maxHibernationDelay: 2h0m0s
    defaultWakeTimeout: 2m0s
    maxWakeTimeout: 5m0s
    # A task that sets no completion.timeout stops after an hour. No default
    # TTL: a TTL deletes the whole task record, including its status and
    # artifacts, so the task owner chooses it.
    defaultTaskTimeout: 1h0m0s
{{- end }}
