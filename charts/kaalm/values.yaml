# Kaalm Helm values. Defaults match the design (docs/src/operations/deployment.md).
# The controller and gateway both have a hard floor of 2 replicas, enforced by a
# template guard; going below aborts rendering.

controller:
  replicas: 2
  image:
    repository: ghcr.io/win07xp/kaalm-controller
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Deprecated: set gateway.trustClusterCAForUpstream instead, which also
  # governs the controller's provider health probe trust. Still honored: when
  # true, the cluster CA (kaalm-ca-system, already mounted at
  # /var/run/kaalm/ca.crt) is added to the probe trust pool, once even when
  # both values are set. NOTES.txt prints a warning while it is set.
  trustClusterCAForProbes: false
  # Deprecated: set gateway.upstreamCA instead, which the chart also
  # projects into the controller. Still honored: configMap names an
  # operator-supplied ConfigMap of CA certificates that the chart projects into
  # the controller as probe-ca.crt and adds to the probe trust pool, unless it
  # names the same ConfigMap and key as gateway.upstreamCA, in which case it is
  # projected once. NOTES.txt prints a warning while configMap is set.
  probeCA:
    configMap: ""
    key: ca.crt
  # Reconciles the Agent, AgentChannel, and AgentTask controllers may each
  # run at once. controller-runtime still serializes per object, so this only
  # lets different objects reconcile in parallel; 1 is the strictly serial
  # setting.
  maxConcurrentReconciles: 4
  # Lifetime of the per-workload client certificate issued to every Agent and
  # AgentTask. cert-manager re-issues each one renewBefore ahead of expiry. A
  # leaked certificate stays valid until it expires, so a shorter duration
  # bounds that window. Go durations; renewBefore must be shorter than
  # duration, or the controller exits at startup.
  certificate:
    duration: 2160h     # 90d
    renewBefore: 720h   # 30d
  # Port for a net/http/pprof listener, for profiling under load. 0 keeps it
  # off, which is the production setting: the listener is unauthenticated
  # and is meant to be reached through kubectl port-forward, never a Service.
  pprofPort: 0
  # Log level for the JSON logs: debug, info, or error. Passed as
  # --zap-log-level; a number above 0 also works and raises verbosity further.
  logLevel: info
  # Kubernetes API client rate limit: sustained requests per second and the
  # burst above it. The defaults are controller-runtime's.
  client:
    qps: 20
    burst: 30
  # Container resources, rendered verbatim. No CPU limit by default, so a
  # reconcile burst is never throttled; the memory limit bounds the informer
  # cache.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Peers of the DNS egress rule on every synthesized workload NetworkPolicy:
  # the namespaces and Pods agents may reach on port 53. The default matches
  # kubeadm, EKS, GKE, AKS, k3s, and the upstream CoreDNS chart. Change it when
  # DNS runs elsewhere; an empty podLabels allows every Pod in the namespaces.
  networkPolicy:
    dnsSelector:
      namespaceLabels:
        kubernetes.io/metadata.name: kube-system
      podLabels:
        k8s-app: kube-dns

gateway:
  replicas: 2
  image:
    repository: ghcr.io/win07xp/kaalm-gateway
    tag: ""
    pullPolicy: IfNotPresent
  # Maximum fallback-chain depth for LLM provider routing (KAALM_MAX_FALLBACK_DEPTH).
  maxFallbackDepth: 3
  # Trust the cluster CA (kaalm-ca-system, already mounted at
  # /var/run/kaalm/ca.crt) for upstream provider TLS, in addition to the
  # public system roots. Enable this to route to in-cluster or self-hosted
  # providers whose endpoint is served with a cert signed by kaalm-ca-issuer.
  # Off by default; public providers need only the system roots. This value
  # also governs the controller's ModelProvider and ToolProvider health probe
  # trust, so a provider that is forwarded to is also probed Healthy.
  trustClusterCAForUpstream: false
  # An operator-supplied ConfigMap of additional CA certificates to trust for
  # upstream provider TLS (the kaalm-upstream-ca bundle in the design docs). Set
  # configMap to its name to have the chart mount it and pass it to the gateway;
  # leave empty to trust only the system roots. It composes with
  # trustClusterCAForUpstream: enabling both merges the cluster CA and this
  # bundle into one trust pool. The gateway re-reads it when it rotates. The
  # chart also projects it into the controller (as upstream-ca.crt), so it
  # governs the controller's health probe trust too.
  upstreamCA:
    configMap: ""
    key: ca.crt
  # Trust the cluster CA (kaalm-ca-system) for AgentChannel callbackUrl TLS, in addition
  # to the public system roots. Enable this to deliver async responses to
  # in-cluster or self-hosted callback receivers served with a kaalm-ca-issuer
  # cert. Off by default; public receivers need only the system roots.
  trustClusterCAForCallbacks: false
  # Additional DNS names appended to the kaalm-gateway-tls certificate SANs.
  # Required when the User listener is exposed via TLS pass-through Ingress.
  externalHostnames: []
  # DNS-name suffixes or CIDR blocks whose AgentChannel.spec.webhook.callbackUrl
  # targets are permitted despite the deny-internal default, for in-cluster or
  # self-hosted receivers (for example ".svc.cluster.local" or "10.43.0.0/16").
  # Empty keeps the deny-internal default. Loopback and link-local (cloud
  # metadata) stay blocked even if listed. Applies to both the controller's
  # reconcile-time validation (rule 22) and the gateway's pre-dial re-check.
  callbackUrl:
    allowlist: []
  # Where the platform channel adapters (AgentChannel spec.type discord and
  # whatsapp) send replies. Operator-set and trusted like a
  # ModelProvider endpoint: not subject to the callbackUrl deny ranges, and
  # http:// is accepted, so an e2e mock can stand in. The WhatsApp value
  # carries the Graph API version segment; change it to move versions.
  platforms:
    discord:
      apiBaseUrl: https://discord.com/api/v10
    whatsapp:
      apiBaseUrl: https://graph.facebook.com/v23.0
  # OpenTelemetry tracing (docs/src/operations/observability.md#tracing).
  # Off by default: with no endpoint, no tracer is installed and no trace
  # context is created or forwarded. Set otlpEndpoint to an OTLP/HTTP base
  # URL (for example http://collector.monitoring.svc:4318); an https endpoint
  # is verified against the gateway's upstream trust pool (system roots plus
  # whatever trustClusterCAForUpstream and upstreamCA configure). sampleRatio
  # is the parent-based head sampling ratio for traces the gateway starts.
  tracing:
    otlpEndpoint: ""
    sampleRatio: 1.0
  # Rolling window over which PlatformConnected is evaluated.
  channelHealthWindow: 5m
  # Bounds the TCP connect attempt when delivering POST /v1/message.
  agentDeliveryConnectTimeout: 1s
  # Total sync-mode wall-clock budget (wake + delivery retries + processing).
  syncDeliveryDeadline: 30s
  # Per-attempt upstream LLM-provider bound (the gateway's --upstream-timeout).
  # It sets two bounds: the wait for the first response byte, then the
  # mid-stream idle-bytes bound between response body reads. A stream that
  # keeps sending bytes runs to completion.
  providerFirstByteTimeout: 120s
  # Whole-call bound for a brokered MCP tool call, response included (the
  # gateway's --mcp-upstream-timeout). Over it gives 504 tool_timeout.
  mcpUpstreamTimeout: 120s
  # Per-attempt read of an agent's /v1/message response.
  agentReadTimeout: 10s
  # Per-attempt read of a callback receiver's response.
  callbackReadTimeout: 10s
  # Backoff schedules (4 attempts total).
  agentDeliveryRetryBackoff: "1s,5s,25s"
  callbackRetryBackoff: "1s,5s,25s"
  # Body-size caps.
  maxResponseBodyBytes: 900Ki
  maxMessageBodyBytes: 1Mi
  maxLLMRequestBodyBytes: 4Mi
  # Request and response body cap for a brokered MCP tool call (the gateway's
  # --mcp-max-body-bytes).
  mcpMaxBodyBytes: 4Mi
  # Dedicated health/readiness port (kubelet probes).
  healthPort: 8081
  # Port for a net/http/pprof listener, for profiling under load. 0 keeps it
  # off, which is the production setting; see controller.pprofPort.
  pprofPort: 0
  # Log level for the JSON logs: debug, info, warn, or error.
  logLevel: info
  # Kubernetes API client rate limit: sustained requests per second and the
  # burst above it. Sized for a proxy's live reads (task-completion
  # cross-checks, first-use Secret loads), not a reconciler's.
  client:
    qps: 100
    burst: 200
  # Container resources, rendered verbatim. No CPU limit by default, so
  # request bursts are never throttled.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# NetworkPolicy for the operator's own Pods: default-deny ingress, with the
# controller's activator, conversion, and probe ports, the gateway's two
# listeners and probe port, and the console open to the callers that need
# them. The metrics ports (controller :8080, gateway :9090) are unauthenticated
# and label spend by namespace and model, so they open only to metricsFrom.
# Inert on a CNI that does not enforce NetworkPolicy; set enabled to false to
# ship no policy at all.
networkPolicy:
  enabled: true
  # NetworkPolicy peers allowed to scrape the metrics ports. An empty list
  # closes the metrics ports to every source.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # NetworkPolicy peers allowed to reach the gateway User listener (:8080) and
  # the console (:8443). Empty admits any source; the listeners authenticate
  # their callers themselves.
  userListenerFrom: []

certManager:
  # cert-manager's cluster resource namespace. The kaalm-ca Certificate and its
  # Secret MUST live here (not kaalm-system), or issuance fails cluster-wide
  # with SecretNotFound. Must match cert-manager's --cluster-resource-namespace
  # and trust-manager's --trust-namespace.
  clusterResourceNamespace: cert-manager

trustManager:
  # Optional namespaceSelector object passed verbatim into the workload CA
  # Bundle's (kaalm-ca) target.namespaceSelector. Empty projects into every
  # namespace. Narrows the workload Bundle only: the operator reads its own
  # Bundle, kaalm-ca-system, which always targets the release namespace.
  bundleSelector: {}
  # Additional trust-manager Bundle sources, rendered verbatim after the
  # kaalm-ca Secret source into both the kaalm-ca and kaalm-ca-system
  # Bundles. Used by the CA re-key runbook to keep an old CA certificate
  # trusted while cert-manager issues a new one, for example:
  #   extraSources:
  #     - configMap:
  #         name: kaalm-ca-old
  #         key: ca.crt
  # A Secret source works the same way:
  #   extraSources:
  #     - secret:
  #         name: kaalm-ca-old
  #         key: ca.crt
  # trust-manager reads Bundle sources only from its trust namespace, so the
  # ConfigMap or Secret must live there.
  extraSources: []

# A default "standard" AgentClass for general-purpose agents. Set false to omit
# it (platform teams often ship their own). It carries helm.sh/resource-policy:
# keep so an uninstall does not orphan running Agents.
standardAgentClass:
  enabled: true
  # ModelProviders an Agent or AgentTask of this class may name in
  # spec.providers. Empty allows none, because the chart installs no
  # ModelProvider and a class naming one that does not exist reports
  # Ready=False with InvalidReference. Set it to the names you create:
  # --set standardAgentClass.allowedProviders={anthropic-shared}
  allowedProviders: []
  # Namespace patterns (path.Match globs, such as team-*) whose Agents and
  # AgentTasks may use this class, rendered into spec.allowedNamespaces. Empty
  # leaves the field unset, so the class admits every namespace. This differs
  # from a ModelProvider, where an empty list admits none: the CRD rejects an
  # empty list on a class. Quote the list so the shell does not split it or
  # expand the *:
  # --set 'standardAgentClass.allowedNamespaces={team-a,team-data-*}'
  allowedNamespaces: []

# The optional operator console (docs/src/console/overview.md): read-only
# fleet visibility plus one governed test-chat action. Off by default; a
# default install creates no console objects at all. Enabling creates the
# kaalm-console Deployment, Service, RBAC, and certificate. One replica by
# design (login sessions are held in memory), so there is no replicas knob.
console:
  enabled: false
  image:
    repository: ghcr.io/win07xp/kaalm-console
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Dedicated health/readiness port (kubelet probes).
  healthPort: 8081
  # Log level for the JSON logs: debug, info, warn, or error.
  logLevel: info
  resources: {}

# Roles for people (docs/src/security/rbac.md#roles-for-people). Off renders
# nothing: a default install creates none of these objects. The template reads
# these values with `default dict`, so this block documents the defaults and
# changes no rendering.
rbac:
  personas:
    # Installs four ClusterRoles: kaalm-platform-admin, kaalm-catalog-reader,
    # kaalm-developer, and kaalm-secrets-admin. The subject lists below bind
    # them. Subject values set while this is false are ignored.
    enabled: false
    # Subjects are rbac.authorization.k8s.io/v1 Subject objects, rendered
    # verbatim. A User or Group needs apiGroup: rbac.authorization.k8s.io, and
    # a ServiceAccount needs a namespace. An empty list renders no binding.
    #
    # Bound with ClusterRoleBinding kaalm-platform-admin.
    platformAdmins: []
    # Bound with ClusterRoleBinding kaalm-catalog-reader. Add the developer
    # groups here so developers can read the catalog.
    catalogReaders: []
    # Bound with RoleBinding kaalm-secrets-admin in the release namespace only:
    # the LLM and tool credentials.
    secretsAdmins: []
    # A map of namespace to subject list. Each namespace with a non-empty list
    # gets RoleBinding kaalm-secrets-admin there, so that team's credential
    # manager owns that namespace's channel credentials. The namespace must
    # already exist, and it must not be the release namespace (use
    # secretsAdmins). A value that is not a map fails the render. Ignored while
    # personas.enabled is false. Example:
    #   namespaceSecretsAdmins:
    #     team-support:
    #       - kind: Group
    #         name: team-support-credentials
    #         apiGroup: rbac.authorization.k8s.io
    namespaceSecretsAdmins: {}
    # A map of namespace to subject list. Each namespace with a non-empty list
    # gets RoleBinding kaalm-developer there. The namespace must already exist,
    # or helm install and upgrade fail with namespace not found. A value that
    # is not a map fails the render. Example:
    #   developers:
    #     team-new:
    #       - kind: Group
    #         name: team-new-developers
    #         apiGroup: rbac.authorization.k8s.io
    developers: {}
    # Adds get and create on pods/exec to kaalm-developer. No effect while
    # personas.enabled is false.
    developerExec: false
    # Adds get, list, watch, create, update, patch, and delete on Secrets to
    # kaalm-developer, in every namespace where it is bound. A channel still
    # uses only Secrets labeled kaalm.io/channel-credential: "true", and a
    # workload's env only Secrets labeled kaalm.io/workload-secret: "true".
    # No effect while personas.enabled is false.
    developerSecrets: false
  # Adds Agent, AgentTask, and AgentChannel to the built-in view, edit, and
  # admin roles. Works without personas.enabled. Never adds the catalog kinds
  # (AgentClass, ModelProvider, ToolProvider) or Secrets.
  aggregateToDefaultRoles: false
