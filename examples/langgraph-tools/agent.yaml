# The langgraph-tools example as an Agent. Requires an MCP ToolProvider the
# class allows and the namespace is admitted to (guide: Providing Tool
# Access), plus an OpenAI-format ModelProvider for the model side.
apiVersion: kaalm.io/v1alpha1
kind: Agent
metadata:
  name: langgraph-tools
  namespace: default
spec:
  agentClassRef:
    name: standard
  image: registry.example.com/agents/langgraph-tools:0.1.0
  providers:
    - providerRef:
        name: openai-shared
  tools:
    - providerRef:
        name: search-tools
      # Narrow to named tools, or omit to accept the provider's catalog.
      tools: ["web_search"]
  env:
    - name: KAALM_MODEL
      value: openai-shared/gpt-5.2
    - name: KAALM_TOOL_PROVIDER
      value: search-tools
  lifecycle:
    activitySource: gatewayTraffic
