# The langgraph-chat example as an Agent. Adjust the class, provider, and
# image references to your cluster; KAALM_MODEL must name a model on an
# OpenAI-format provider (spec.type openai or openai-compatible).
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: langgraph-chat
  namespace: default
spec:
  agentClassRef:
    name: standard
  image: registry.example.com/agents/langgraph-chat:0.1.0
  providers:
    - providerRef:
        name: openai-shared
  env:
    - name: KAALM_MODEL
      value: openai-shared/gpt-5.2
  # The checkpointer lives on the PVC; without persistence every wake
  # starts the conversation cold.
  persistence:
    enabled: true
    sizeGi: 1
  lifecycle:
    hibernationEnabled: true
    activitySource: gatewayTraffic
