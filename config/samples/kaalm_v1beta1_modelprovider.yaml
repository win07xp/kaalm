apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: anthropic-shared
spec:
  type: anthropic
  endpoint: https://api.anthropic.com
  # The Secret must carry the label kaalm.io/provider-credential: "true" and
  # list the endpoint host (api.anthropic.com) in its kaalm.io/provider-hosts
  # annotation.
  credentialsRef:
    name: anthropic-api-key
    key: token
  models:
    - id: claude-opus-4-6
      costPer1MInputTokens: "15.00"
      costPer1MOutputTokens: "75.00"
    - id: claude-sonnet-4-6
      costPer1MInputTokens: "3.00"
      costPer1MOutputTokens: "15.00"
  allowedNamespaces: ["team-*"]
  budget:
    period: monthly
    perNamespaceUSD: "500"
    policies:
      - atPercent: 80
        action: warn
      - atPercent: 100
        action: degrade
        degradeTo: claude-sonnet-4-6
