# The conversion webhook stanza for modelproviders.kaalm.io (design book, API
# Versioning and Deprecation): the controller serves POST /convert on the
# conversion port of the kaalm-controller Service, on every replica. The
# namespace is literal because the chart's crds/ directory is static.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelproviders.kaalm.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: kaalm-system
          name: kaalm-controller
          path: /convert
          port: 9444
