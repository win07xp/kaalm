# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/kaalm.io_agentclasses.yaml
- bases/kaalm.io_modelproviders.yaml
- bases/kaalm.io_agents.yaml
- bases/kaalm.io_agenttasks.yaml
- bases/kaalm.io_agentchannels.yaml
- bases/kaalm.io_toolproviders.yaml
# +kubebuilder:scaffold:crdkustomizeresource

# Conversion webhook (since v0.6.0): every CRD gets the conversion stanza and
# the cainjector annotation. The chart's crds/ directory is this build's
# output, split per CRD (make chart-sync).
patches:
- path: patches/webhook_in_agentclasses.yaml
- path: patches/cainjection_in_agentclasses.yaml
- path: patches/webhook_in_modelproviders.yaml
- path: patches/cainjection_in_modelproviders.yaml
- path: patches/webhook_in_toolproviders.yaml
- path: patches/cainjection_in_toolproviders.yaml
- path: patches/webhook_in_agents.yaml
- path: patches/cainjection_in_agents.yaml
- path: patches/webhook_in_agenttasks.yaml
- path: patches/cainjection_in_agenttasks.yaml
- path: patches/webhook_in_agentchannels.yaml
- path: patches/cainjection_in_agentchannels.yaml
# +kubebuilder:scaffold:crdkustomizewebhookpatch
