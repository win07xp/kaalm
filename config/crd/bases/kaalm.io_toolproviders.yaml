---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: toolproviders.kaalm.io
spec:
  group: kaalm.io
  names:
    kind: ToolProvider
    listKind: ToolProviderList
    plural: toolproviders
    shortNames:
    - tp
    singular: toolprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Healthy")].status
      name: Healthy
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ToolProvider is the Schema for the toolproviders API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ToolProviderSpec is a platform-owned wrapper around one external tool
              server: its protocol, endpoint, credentials, tool catalog, and tenancy.
              It deliberately rhymes with ModelProviderSpec; the gateway brokers tool
              calls the way it proxies LLM calls. See docs/src/resources/toolprovider.md
              and docs/src/gateways/tool-plane.md.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces are glob patterns; a caller's namespace must match one.
                  "*" allows all; empty allows none.
                items:
                  type: string
                type: array
              credentialsRef:
                description: |-
                  CredentialsRef points at the Secret key holding the server credential,
                  resolved only from the operator namespace, never from a tenant
                  namespace. Omit it for servers that require no authentication.
                properties:
                  key:
                    description: Key within the Secret's data.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              endpoint:
                description: |-
                  Endpoint is the tool server base URL. Must be HTTPS; in-cluster and
                  external endpoints are equally valid.
                pattern: ^https://
                type: string
              healthCheck:
                description: |-
                  HealthCheck configures the periodic upstream liveness probe. A nil block
                  defaults to an enabled probe at reconcile time (the CRD default on enabled
                  only fires when the block is present).
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled runs the periodic upstream liveness probe. Set false to disable it.
                      The json tag deliberately has no omitempty: a serialized explicit false
                      must survive the wire, or the CRD default would overwrite it.
                    type: boolean
                  intervalSeconds:
                    format: int32
                    type: integer
                  timeoutSeconds:
                    format: int32
                    type: integer
                type: object
              rateLimits:
                description: |-
                  RateLimits sets the per-namespace request ceiling for brokered calls.
                  The configured value is a cluster-wide ceiling; each gateway replica
                  divides it by the live replica count, exactly as ModelProvider rate
                  limits are enforced. Zero or omitted means no limit.
                properties:
                  requestsPerMinute:
                    format: int32
                    type: integer
                type: object
              tools:
                description: |-
                  Tools is the optional declared catalog, keyed by id. When present it is
                  a ceiling: the broker rejects calls to uncataloged tools, grants are
                  validated against it (rule 38), and the audit metric's tool label is
                  bounded by it. When omitted, the server's own tools/list governs.
                items:
                  description: ToolProviderTool is one entry in the declared catalog.
                  properties:
                    id:
                      description: ID is the tool name as the server exposes it.
                      minLength: 1
                      type: string
                  required:
                  - id
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              type:
                description: |-
                  Type selects the tool protocol. v0.4.0 supports exactly "mcp"
                  (MCP streamable HTTP); the slot exists so a future protocol is an
                  addition, not a reshape.
                enum:
                - mcp
                type: string
            required:
            - endpoint
            - type
            type: object
          status:
            description: ToolProviderStatus is the observed state of a ToolProvider.
            properties:
              conditions:
                description: Conditions report Ready and Healthy.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
