# In-cluster infrastructure for the perf harness (test/perf), applied once per
# run before any phase. Everything the fleet needs that is not itself under
# measurement: the namespace, the mock LLM provider it forwards to, the four
# ModelProviders the gateway legs target, the channel secrets, the load
# generator's ServiceAccount, for the tools phase the mock MCP server with its
# credential and the perf-mcp ToolProvider, and for the stream phase two more
# ModelProviders (perf-anthropic and perf-paced).
apiVersion: v1
kind: Namespace
metadata:
  name: perf
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgen
  namespace: perf
---
# The channels' inbound bearer; the gateway reads it through the scoped grant
# the AgentChannel reconciler creates.
apiVersion: v1
kind: Secret
metadata:
  name: perf-hook
  namespace: perf
  labels:
    kaalm.io/channel-credential: "true"
type: Opaque
stringData:
  token: perf-webhook-bearer-token
---
# The callback signing key for async replies pushed to the mock's receiver.
apiVersion: v1
kind: Secret
metadata:
  name: perf-callback-hmac
  namespace: perf
  labels:
    kaalm.io/channel-credential: "true"
type: Opaque
stringData:
  key: perf-callback-hmac-key
---
# The mock provider, the same test double the e2e suite uses, in the perf
# namespace so its Service name matches the gateway's callback allowlist
# (make perf-deploy sets gateway.callbackUrl.allowlist={mock-provider.perf.svc}).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mock-provider-tls
  namespace: perf
spec:
  secretName: mock-provider-tls
  issuerRef:
    name: kaalm-ca-issuer
    kind: ClusterIssuer
  usages:
    - server auth
  dnsNames:
    - mock-provider.perf.svc
    - mock-provider.perf.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-provider
  namespace: perf
  labels:
    app: mock-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-provider
  template:
    metadata:
      labels:
        app: mock-provider
    spec:
      containers:
        - name: mock-provider
          image: registry.test/mock/llm-provider:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8443
            - --tls-cert=/var/run/tls/tls.crt
            - --tls-key=/var/run/tls/tls.key
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /var/run/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: mock-provider-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mock-provider
  namespace: perf
spec:
  selector:
    app: mock-provider
  ports:
    - port: 8443
      targetPort: 8443
---
# The providers' credential, resolved in the operator namespace.
apiVersion: v1
kind: Secret
metadata:
  name: perf-mock-key
  namespace: kaalm-system
  labels:
    kaalm.io/provider-credential: "true"
  annotations:
    kaalm.io/provider-hosts: mock-provider.perf.svc
type: Opaque
stringData:
  token: dummy-mock-credential
---
# Four providers on one mock, told apart by endpoint prefix so the mock's
# per-prefix counters and the gateway's per-provider histograms separate the
# legs. Health probes are off: the mock's liveness is not under measurement.
#
# perf-fast: soft budget, the mock answers immediately. The gateway's own
# per-request cost is what this leg's histogram shows.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: perf-fast
spec:
  type: openai-compatible
  endpoint: https://mock-provider.perf.svc:8443/ok/fast
  credentialsRef:
    name: perf-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - perf
  budget:
    period: daily
    perNamespaceUSD: "1000000"
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
# perf-slow: soft budget, the mock answers after 50 ms, so the leg reflects
# realistic concurrency against a provider that takes time.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: perf-slow
spec:
  type: openai-compatible
  endpoint: https://mock-provider.perf.svc:8443/slow50/slow
  credentialsRef:
    name: perf-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - perf
  budget:
    period: daily
    perNamespaceUSD: "1000000"
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
# perf-hard: hard budget enforcement with a ceiling nothing reaches, so the
# leg measures what synchronous ledger admission costs, not a block.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: perf-hard
spec:
  type: openai-compatible
  endpoint: https://mock-provider.perf.svc:8443/ok/hard
  credentialsRef:
    name: perf-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - perf
  budget:
    period: daily
    perNamespaceUSD: "1000000"
    enforcement: hard
    hard:
      boundaryMarginPercent: 5
    policies:
      - atPercent: 100
        action: block
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
# perf-limited: perf-fast with request and token rate limits set far above
# any rate the leg reaches, so every request runs the limiter (admission,
# then the token debit once usage settles) and none is refused.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: perf-limited
spec:
  type: openai-compatible
  endpoint: https://mock-provider.perf.svc:8443/ok/limited
  credentialsRef:
    name: perf-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - perf
  budget:
    period: daily
    perNamespaceUSD: "1000000"
  rateLimits:
    requestsPerMinute: 2000000000
    tokensPerMinute: 2000000000
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
# perf-anthropic: perf-fast as the Anthropic type, so the stream phase's
# Anthropic leg is relayed natively by the messages adapter and measures the
# relay, not a format translation.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: perf-anthropic
spec:
  type: anthropic
  endpoint: https://mock-provider.perf.svc:8443/ok/anthropic
  credentialsRef:
    name: perf-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - perf
  budget:
    period: daily
    perNamespaceUSD: "1000000"
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
# perf-paced: perf-fast with the mock waiting 10 ms before each streamed
# event after the first, so the stream phase's paced leg shows time to first
# byte and time to last byte apart: the gateway passes each event on as it
# arrives instead of buffering the answer.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: perf-paced
spec:
  type: openai-compatible
  endpoint: https://mock-provider.perf.svc:8443/pace10/paced
  credentialsRef:
    name: perf-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - perf
  budget:
    period: daily
    perNamespaceUSD: "1000000"
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
# The tools phase's tool server: the e2e suite's mock MCP server, speaking
# only the 2026-07-28 revision. It answers 401 to any request without the
# perf-tool-key credential, so a 200 through the broker proves the gateway
# injected it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mock-mcp-tls
  namespace: perf
spec:
  secretName: mock-mcp-tls
  issuerRef:
    name: kaalm-ca-issuer
    kind: ClusterIssuer
  usages:
    - server auth
  dnsNames:
    - mock-mcp.perf.svc
    - mock-mcp.perf.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-mcp
  namespace: perf
  labels:
    app: mock-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-mcp
  template:
    metadata:
      labels:
        app: mock-mcp
    spec:
      containers:
        - name: mock-mcp
          image: registry.test/mock/mcp-server:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8443
            - --tls-cert=/var/run/tls/tls.crt
            - --tls-key=/var/run/tls/tls.key
            - --modern
            # Must match the perf-tool-key Secret below: brokered calls
            # succeed only because the gateway injected that value.
            - --require-bearer=perf-tool-credential
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /var/run/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: mock-mcp-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mock-mcp
  namespace: perf
spec:
  selector:
    app: mock-mcp
  ports:
    - port: 8443
      targetPort: 8443
---
# The tool server's credential, resolved in the operator namespace.
apiVersion: v1
kind: Secret
metadata:
  name: perf-tool-key
  namespace: kaalm-system
  labels:
    kaalm.io/provider-credential: "true"
  annotations:
    kaalm.io/provider-hosts: mock-mcp.perf.svc
type: Opaque
stringData:
  token: perf-tool-credential
---
# perf-mcp: the tools phase's ToolProvider. The declared catalog matches the
# mock's, so the broker's tool label stays bounded. Health probes are off, as
# on the ModelProviders.
apiVersion: kaalm.io/v1beta1
kind: ToolProvider
metadata:
  name: perf-mcp
spec:
  type: mcp
  endpoint: https://mock-mcp.perf.svc:8443
  credentialsRef:
    name: perf-tool-key
    key: token
  allowedNamespaces:
    - perf
  tools:
    - id: web_search
    - id: fetch_page
  healthCheck:
    enabled: false
