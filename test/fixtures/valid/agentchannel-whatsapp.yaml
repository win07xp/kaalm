# A WhatsApp platform channel (since v0.7.0): type and block paired (rule 39),
# a digits-only phone number id.
apiVersion: kaalm.io/v1beta1
kind: AgentChannel
metadata:
  name: support-whatsapp
  namespace: default
spec:
  agentRef:
    name: support-assistant
  type: whatsapp
  whatsapp:
    path: /channels/default/support-whatsapp
    credentialsRef:
      name: whatsapp-app-credentials
    phoneNumberId: "106540352242922"
