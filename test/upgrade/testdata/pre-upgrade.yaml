# The pre-upgrade world for the S21 upgrade e2e: everything a cluster on the
# previous release holds before the upgrade, written the way its users write
# it. __PREV__ is substituted with PREV_CHART_VERSION at apply time so the
# workloads run the previous release's published base images, because the
# scenario upgrades what users actually run.
apiVersion: v1
kind: Namespace
metadata:
  name: up-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: up-hook
  namespace: up-e2e
  labels:
    kaalm.io/channel-credential: "true"
type: Opaque
stringData:
  token: up-webhook-bearer-token
---
apiVersion: v1
kind: Secret
metadata:
  name: up-provider-key
  namespace: kaalm-system
  labels:
    kaalm.io/provider-credential: "true"
  annotations:
    kaalm.io/provider-hosts: up-provider.invalid,up-tools.invalid
type: Opaque
stringData:
  token: up-provider-credential
---
# A model provider and a tool provider on the provider Secret. Nothing
# references them. The probes stay on: a failing probe sets Healthy=False
# and leaves Ready=True, so Ready shows only the credential checks.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: up-provider
spec:
  type: openai
  endpoint: https://up-provider.invalid
  credentialsRef:
    name: up-provider-key
    key: token
---
apiVersion: kaalm.io/v1beta1
kind: ToolProvider
metadata:
  name: up-tools
spec:
  type: mcp
  endpoint: https://up-tools.invalid
  credentialsRef:
    name: up-provider-key
    key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: up-env
  namespace: up-e2e
  labels:
    kaalm.io/workload-secret: "true"
type: Opaque
stringData:
  token: up-env-token
---
# The class for the agent that keeps running and for the finished task. No
# hibernation: the keeper must sit in Running across the whole upgrade.
apiVersion: kaalm.io/v1beta1
kind: AgentClass
metadata:
  name: up-service
spec:
  runtime:
    backend: pod
  image:
    allowedImages: ["ghcr.io/win07xp/*"]
    allowHandlerMounts: true
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    defaultSizeGi: 1
---
# The class for the agent that hibernates before the upgrade. Same positive
# timers as the s7 fixtures: idle evaluation only runs when the effective
# idleTimeout is > 0.
apiVersion: kaalm.io/v1beta1
kind: AgentClass
metadata:
  name: up-hibernating
spec:
  runtime:
    backend: pod
  image:
    allowedImages: ["ghcr.io/win07xp/*"]
    allowHandlerMounts: true
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    defaultSizeGi: 1
  lifecycle:
    hibernationAllowed: true
    defaultIdleTimeout: 2s
    defaultHibernationDelay: 2s
    defaultWakeTimeout: 0s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: up-handler
  namespace: up-e2e
immutable: true
data:
  handler.py: |
    def handle_message(envelope):
        return {
            "content": "upgraded greeter: " + str(envelope.get("content", "")),
            "attachments": [],
            "metadata": {},
        }
---
# The keeper: Running before the upgrade, must still be Running in the same
# Pod with the same volume after it.
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: up-keeper
  namespace: up-e2e
spec:
  agentClassRef:
    name: up-service
  image: ghcr.io/win07xp/kaalm-agent-python:__PREV__
  env:
    - name: UP_ENV_TOKEN
      valueFrom:
        secretKeyRef:
          name: up-env
          key: token
  handler:
    configMapRef:
      name: up-handler
  persistence:
    enabled: true
  lifecycle:
    activitySource: gatewayTraffic
    idleTimeout: 0s
    hibernationEnabled: false
---
# The sleeper: Hibernated before the upgrade, must still be Hibernated after
# it, and must wake on its next message as before.
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: up-sleeper
  namespace: up-e2e
spec:
  agentClassRef:
    name: up-hibernating
  image: ghcr.io/win07xp/kaalm-agent-python:__PREV__
  handler:
    configMapRef:
      name: up-handler
  persistence:
    enabled: true
  lifecycle:
    activitySource: gatewayTraffic
    hibernationEnabled: true
---
# Async channel on the sleeper: the post-upgrade wake message goes through
# it, which is also the proof that the channel still answers.
apiVersion: kaalm.io/v1beta1
kind: AgentChannel
metadata:
  name: up-channel
  namespace: up-e2e
spec:
  agentRef:
    name: up-sleeper
  type: webhook
  webhook:
    path: /channels/up-e2e/up-channel
    responseMode: async
    content:
      fromBody: content.text
    auth:
      type: bearer
      secretRef:
        name: up-hook
        key: token
---
# Yesterday's finished task: agentReported through the published base
# image's autocomplete hook, completed long before the upgrade, no TTL so
# it survives to be asserted on. Its status must come through untouched.
apiVersion: kaalm.io/v1beta1
kind: AgentTask
metadata:
  name: up-task
  namespace: up-e2e
spec:
  agentClassRef:
    name: up-service
  image: ghcr.io/win07xp/kaalm-agent-go:__PREV__
  env:
    - name: KAALM_TASK_AUTOCOMPLETE
      value: success
    - name: UP_ENV_TOKEN
      valueFrom:
        secretKeyRef:
          name: up-env
          key: token
  completion:
    condition: agentReported
    timeout: 5m
    onTimeout: Fail
---
# The runner: a task still Running when the upgrade happens. Without
# KAALM_TASK_AUTOCOMPLETE the runtime serves until the timeout, so it stays
# Running across the upgrade. The previous release named its Certificate
# up-runner-tls and its NetworkPolicy up-runner; after the upgrade it must
# keep that Certificate and get its new NetworkPolicy beside the old one.
apiVersion: kaalm.io/v1beta1
kind: AgentTask
metadata:
  name: up-runner
  namespace: up-e2e
spec:
  agentClassRef:
    name: up-service
  image: ghcr.io/win07xp/kaalm-agent-go:__PREV__
  completion:
    condition: agentReported
    timeout: 30m
    onTimeout: Fail
