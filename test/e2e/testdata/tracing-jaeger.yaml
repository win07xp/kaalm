# Jaeger all-in-one as the OTLP sink for the tracing e2e (S20). Applied by
# make e2e-deploy BEFORE the chart, because the chart is installed with
# gateway.tracing.otlpEndpoint pointing here; the suite's spec re-applies it
# idempotently. Throwaway: in-memory storage, no persistence.
apiVersion: v1
kind: Namespace
metadata:
  name: tracing-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: query, containerPort: 16686}
          readinessProbe:
            httpGet: {path: /, port: 14269}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: tracing-e2e
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: query, port: 16686, targetPort: 16686}
