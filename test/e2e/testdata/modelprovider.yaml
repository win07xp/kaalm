# Hermetic e2e: the probe is off, so Ready goes True on a dummy credential
# with no live endpoint. Every provider type is probed when the probe is on,
# google-vertex included (it mints a token from a service-account key).
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: e2e-vertex
spec:
  type: google-vertex
  endpoint: https://us-central1-aiplatform.googleapis.com
  credentialsRef:
    name: e2e-vertex-key
    key: token
  healthCheck:
    enabled: false
  # Since v0.4.0 an omitted allowedNamespaces list allows none.
  allowedNamespaces: ["*"]
  models:
    - id: gemini-1.5-pro
      costPer1MInputTokens: "1.25"
      costPer1MOutputTokens: "5.00"
