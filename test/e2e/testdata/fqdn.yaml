# FQDN egress on a Cilium CNI: a class that allows one host and no CIDRs, and
# an Agent under it. The controller synthesizes fqdn-agent-fqdn, a
# CiliumNetworkPolicy with a toFQDNs rule for example.com.
apiVersion: kaalm.io/v1beta1
kind: AgentClass
metadata:
  name: fqdn-egress
spec:
  runtime:
    backend: pod
  image:
    allowedImages: ["registry.test/agents/*"]
    pullPolicy: IfNotPresent
  network:
    egress:
      allowedHosts: ["example.com"]
  lifecycle:
    defaultIdleTimeout: 0s
    defaultHibernationDelay: 0s
    defaultWakeTimeout: 0s
    maxIdleTimeout: 0s
    maxHibernationDelay: 0s
    maxWakeTimeout: 0s
---
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: fqdn-agent
  namespace: e2e
spec:
  agentClassRef:
    name: fqdn-egress
  image: registry.test/agents/starter-go:e2e
  lifecycle:
    activitySource: gatewayTraffic
    hibernationDelay: 0s
    idleTimeout: 0s
    wakeTimeout: 0s
