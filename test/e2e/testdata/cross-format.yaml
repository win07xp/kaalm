---
apiVersion: v1
kind: Pod
metadata:
  name: s24-openai-caller
  namespace: e2e
spec:
  serviceAccountName: s24-caller
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/script/call.sh"]
      env:
        - name: PATH_
          value: /v1/chat/completions
        - name: WANT
          value: "200"
        # No max_tokens: the anthropic backup's maxOutputTokens supplies it.
        - name: BODY
          value: '{"model":"s24-openai-primary/mock-gpt","messages":[{"role":"user","content":"hi"}]}'
      volumeMounts:
        - {name: token, mountPath: /var/run/token, readOnly: true}
        - {name: ca, mountPath: /var/run/ca, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
  volumes:
    - name: token
      projected:
        sources:
          - serviceAccountToken: {audience: kaalm-gateway, expirationSeconds: 3600, path: token}
    - name: ca
      configMap: {name: kaalm-ca, items: [{key: ca.crt, path: ca.crt}]}
    - name: script
      configMap: {name: s24-caller-script}
---
apiVersion: v1
kind: Pod
metadata:
  name: s24-thinking-caller
  namespace: e2e
spec:
  serviceAccountName: s24-caller
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/script/call.sh"]
      env:
        - name: PATH_
          value: /v1/messages
        # Extended thinking cannot cross: the walk exhausts on the primary's 503.
        - name: WANT
          value: "502"
        - name: BODY
          value: '{"model":"s24-anthropic-primary/claude-sonnet-4-6","max_tokens":2048,"thinking":{"type":"enabled","budget_tokens":1024},"messages":[{"role":"user","content":"hi"}]}'
      volumeMounts:
        - {name: token, mountPath: /var/run/token, readOnly: true}
        - {name: ca, mountPath: /var/run/ca, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
  volumes:
    - name: token
      projected:
        sources:
          - serviceAccountToken: {audience: kaalm-gateway, expirationSeconds: 3600, path: token}
    - name: ca
      configMap: {name: kaalm-ca, items: [{key: ca.crt, path: ca.crt}]}
    - name: script
      configMap: {name: s24-caller-script}
