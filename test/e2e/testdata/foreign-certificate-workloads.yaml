# Workloads for the foreign-Certificate e2e. Apply this file only after the
# Certificates in foreign-certificate.yaml exist. Applied first, the
# controller would create its own fc-agent-tls and fc-task-tls Certificates,
# and applying the foreign file would then patch those Kaalm-owned objects.
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: fc-agent
  namespace: e2e
spec:
  agentClassRef:
    name: e2e-standard
  image: registry.test/agents/starter-go:e2e
  lifecycle:
    activitySource: gatewayTraffic
    hibernationDelay: 0s
    idleTimeout: 0s
    wakeTimeout: 0s
---
apiVersion: kaalm.io/v1beta1
kind: AgentTask
metadata:
  name: fc-task
  namespace: e2e
spec:
  agentClassRef:
    name: e2e-standard
  image: registry.test/agents/starter-go:e2e
  completion:
    condition: agentReported
    timeout: 2m
