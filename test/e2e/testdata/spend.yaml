# Fixtures for the per-workload spend e2e: the provider, class, and
# two Agents that spend-callers.yaml calls through with distinct call counts,
# so the console must show two distinct rows that sum to the namespace
# figure. The provider points at the shared mock's /bigusage arm (5M+5M
# tokens per call), so each call costs exactly 15.00 USD at the catalog
# prices below.
apiVersion: kaalm.io/v1beta1
kind: ModelProvider
metadata:
  name: console-spend
spec:
  type: openai-compatible
  endpoint: https://mock-provider.e2e.svc:8443/bigusage
  credentialsRef:
    name: e2e-mock-key
    key: token
  healthCheck:
    enabled: false
  allowedNamespaces:
    - console-e2e
  budget:
    period: monthly
    perNamespaceUSD: "100"
    policies:
      - atPercent: 100
        action: block
  models:
    - id: mock-model
      costPer1MInputTokens: "1.00"
      costPer1MOutputTokens: "2.00"
---
apiVersion: kaalm.io/v1beta1
kind: AgentClass
metadata:
  name: console-spend-class
spec:
  runtime:
    backend: pod
  image:
    allowedImages: ["registry.test/agents/*"]
    pullPolicy: IfNotPresent
  allowedProviders:
    - name: console-spend
  lifecycle:
    defaultIdleTimeout: 0s
    defaultHibernationDelay: 0s
    defaultWakeTimeout: 0s
    maxIdleTimeout: 0s
    maxHibernationDelay: 0s
    maxWakeTimeout: 0s
---
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: spend-a
  namespace: console-e2e
spec:
  agentClassRef:
    name: console-spend-class
  image: registry.test/agents/starter-go:e2e
  providers:
    - providerRef:
        name: console-spend
---
apiVersion: kaalm.io/v1beta1
kind: Agent
metadata:
  name: spend-b
  namespace: console-e2e
spec:
  agentClassRef:
    name: console-spend-class
  image: registry.test/agents/starter-go:e2e
  providers:
    - providerRef:
        name: console-spend
