name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides whether the change touches anything the code jobs test. A change
  # confined to the three books, hack/docs, or Markdown files skips build-test,
  # lint, chart, and e2e; a skipped job counts as passed for a required check.
  # The rule fails safe: any path not listed as docs counts as code, and so
  # does a push whose previous commit is unknown. books always runs, because
  # docs-check also verifies the code paths the books cite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      fqdn: ${{ steps.filter.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # On a pull request HEAD is the merge commit, so its first parent is
          # the base branch and the diff is exactly what the PR changes.
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          else
            base="$BEFORE"
          fi
          if ! files=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "cannot diff against '$base'; running every job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "fqdn=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          fqdn=false
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              docs/*|guide/*|learn/*|hack/docs/*|*.md) ;;
              *) code=true; echo "code path: $f" ;;
            esac
            # The Cilium proof is slow and runs only when the FQDN policy
            # path, its cluster script, or its spec changes.
            case "$f" in
              internal/controller/fqdn_policy.go|internal/controller/cni.go|hack/k3d-up.sh|\
              test/e2e/fqdn_test.go|test/e2e/testdata/fqdn*|.github/workflows/ci.yml) fqdn=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "code=$code fqdn=$fqdn"

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated code and manifests are up to date
        run: |
          make manifests generate
          git diff --exit-code || (echo "::error::run 'make manifests generate' and commit the result" && exit 1)

      - name: Audit drift report (non-blocking; see hack/audit/manifest.txt)
        run: |
          git fetch --no-tags --depth=200 origin main
          make audit-drift || echo "::warning::audit verdicts drifted; re-walk them and re-stamp hack/audit/manifest.txt before the next release"

      - name: Build binaries
        run: make build

      - name: Unit and envtest suites (with 85% coverage gate)
        run: make cover-check

      - name: Python base image unit suite (docker test stage)
        run: make python-test

      - name: Python base image contract smoke (real container, mTLS matrix)
        run: make python-smoke PYTHON_AGENT_IMG=kaalm-agent-python:ci

      # Reuses the kaalm-agent-python:ci image the smoke step just built;
      # each example Dockerfile import-checks its handler at build time.
      - name: Framework example images build (LangGraph, against the local base)
        run: make examples-smoke PYTHON_AGENT_IMG=kaalm-agent-python:ci

      - name: Agent runtime module and Go starter tests (native, -race)
        run: make runtime-test

      # The image build runs the module suite in its test stage (build FROM
      # test), so this step also proves the exact path a release build takes.
      - name: Go base image contract smoke (real container, mTLS matrix)
        run: make go-agent-smoke GO_AGENT_IMG=kaalm-agent-go:ci

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: golangci-lint (agentruntime)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: agentruntime
      - name: golangci-lint (starter-go)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: examples/starter-go

  chart:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint and package the Helm chart with synced CRDs
        run: |
          make chart-sync
          helm lint charts/kaalm
          make chart-package # the release workflow packages the same way; fail here, not at a tag

  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check and build the three books
        run: make books

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Download the pinned release binary directly instead of piping the
      # install script from k3d's main branch: retries ride out transient
      # CDN errors (a raw.githubusercontent.com 503 failed this step once),
      # and CI never executes unpinned script content.
      - name: Install k3d
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/local/bin/k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.7.4/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
          k3d version

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run e2e suite
        run: make e2e

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl describe pods -n kaalm-system || true
          kubectl describe pods -n e2e || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=controller --tail=200 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=gateway --tail=200 || true

  # FQDN egress proof on Cilium (#193). Not a required check: it runs only
  # when the FQDN policy path changes.
  e2e-cilium:
    needs: changes
    if: needs.changes.outputs.fqdn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install k3d
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/local/bin/k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.7.4/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
          k3d version

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run the FQDN spec on Cilium
        run: make e2e-cilium

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get ciliumnetworkpolicies -A -o yaml || true
          kubectl describe pods -n e2e || true
          kubectl -n kube-system logs ds/cilium -c cilium-agent --tail=200 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=controller --tail=200 || true
