name: Release

# Releases a v* tag pushed by hand:
#   git tag v2.1.0 && git push origin v2.1.0
# The usual way to release is to merge a release PR (release-merge.yml); a
# tag pushed by hand releases a commit that did not come from one. Both call
# the same publish jobs (release-publish.yml). The notes come from
# releases/<tag>.md at the tagged commit when it exists, and are generated
# otherwise. The upgrade e2e runs next to the publish jobs and does not stop
# a release from a tag pushed by hand, which has no release PR to check
# first. See RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and the sub-module tag
  packages: write # push images and the chart to ghcr

jobs:
  publish:
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ github.ref_name }}
      sha: ${{ github.sha }}

  upgrade:
    permissions:
      contents: read
    uses: ./.github/workflows/upgrade.yml
    with:
      ref: ${{ github.sha }}
