name: Release

# Cutting a release is a single action: push a semver tag.
#   git tag v0.3.0 && git push origin v0.3.0
# This builds and pushes the multi-arch controller, gateway, and agent base
# images (agent-python, agent-go) and the Helm chart to ghcr, pushes the
# agentruntime/vX.Y.Z sub-module tag so the Go runtime module resolves at
# that version, then creates the GitHub release. Pre-release tags
# (v0.3.0-rc.1) are matched too and are the safe way to smoke-test: their
# images/chart carry the pre-release version and never move the `latest` tag.
# See RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  packages: write # push images and the chart to ghcr

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: controller
            binary: manager
            context: .
            dockerfile: Dockerfile
          - component: gateway
            binary: gateway
            context: .
            dockerfile: Dockerfile
          - component: agent-python
            binary: unused # the Python Dockerfile declares but ignores BINARY
            context: images/agent-python
            dockerfile: images/agent-python/Dockerfile
          - component: agent-go
            binary: unused # compiled in-Dockerfile from the agentruntime module
            context: .
            dockerfile: images/agent-go/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4 # arm64 emulation for the cross build
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kaalm-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=${{ matrix.binary }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  # go get github.com/win07xp/kaalm/agentruntime@vX.Y.Z resolves through the
  # sub-module tag agentruntime/vX.Y.Z; publish it alongside the release tag.
  # The v* trigger does not match agentruntime/v*, so this cannot recurse.
  module-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Push the agentruntime sub-module tag
        run: |
          tag="agentruntime/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists; leaving it as is"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5

      - name: Package the chart with the tag version stamped in
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make chart-sync
          helm package charts/kaalm --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push the chart to ghcr as OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          helm push dist/kaalm-*.tgz "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - uses: actions/upload-artifact@v6
        with:
          name: chart
          path: dist/kaalm-*.tgz

  release:
    runs-on: ubuntu-latest
    needs: [images, chart]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Kaalm $GITHUB_REF_NAME" \
            --generate-notes \
            dist/kaalm-*.tgz
