# The S21 upgrade e2e: install the previous released chart, load it with
# workloads, upgrade to this build, assert nothing was recreated and nothing
# was lost. The previous release is the newest release tag (the Makefile's
# PREV_CHART_VERSION), and make e2e-upgrade skips when it is older than the
# oldest release this build upgrades from (UPGRADE_FROM_MIN).
#
# Deliberately not part of ci.yml: most PRs cannot affect the upgrade path,
# so this runs only when a PR touches the API, the shipped CRDs, the storage
# migrator, the spec itself, or this file. It also runs on every release PR,
# because each one adds its notes under releases/, and release.yml calls it
# for a tag pushed by hand.
#
# The release-on-merge tag job (release-merge.yml) tags only after this job
# passed on the release PR's head commit, and finds the check run by this
# job's name. Renaming the job means changing CHECK_NAME there too;
# hack/checkrun's tests fail until both match.
name: upgrade

on:
  pull_request:
    paths:
      - "api/**"
      - "charts/kaalm/crds/**"
      - "internal/storagemigration/**"
      - "test/upgrade/**"
      - ".github/workflows/upgrade.yml"
      - "releases/**"
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty means the event's commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e-upgrade:
    name: e2e-upgrade (from the latest release)
    runs-on: ubuntu-26.04
    steps:
      # The full history, tags included: PREV_CHART_VERSION is the newest
      # release tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned release binary, not the install script from main: retries
      # ride out transient CDN errors and CI never executes unpinned
      # script content (same reasoning as ci.yml's e2e job).
      - name: Install k3d
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/local/bin/k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
          k3d version

      - name: Install kubectl
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/local/bin/kubectl \
            https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      # The job log is not a reliable record (one failed release run has no
      # log at all), so the output also goes to a file for the artifact.
      - name: Run the upgrade e2e
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-upgrade"
          make e2e-upgrade 2>&1 | tee "$RUNNER_TEMP/e2e-upgrade/make-e2e-upgrade.log"

      # make e2e-upgrade deletes the cluster only before it starts, and the
      # test leaves it up, so this step sees the cluster as the failure left
      # it. The first commands show whether a cluster exists at all: the
      # target fails before the test when cluster setup or the image build
      # fails. Every command writes its own file for the artifact.
      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          d="$RUNNER_TEMP/e2e-upgrade"
          mkdir -p "$d"
          k3d cluster list > "$d/k3d-clusters.txt" 2>&1 || true
          docker ps -a > "$d/docker-ps.txt" 2>&1 || true
          kubectl config current-context > "$d/kube-context.txt" 2>&1 || true
          kubectl get all -A 2>&1 | tee "$d/all.txt" || true
          kubectl get crd -o custom-columns='NAME:.metadata.name,STORED:.status.storedVersions' 2>&1 | tee "$d/crds.txt" || true
          kubectl describe pods -n kaalm-system 2>&1 | tee "$d/describe-kaalm-system.txt" || true
          kubectl describe pods -n up-e2e 2>&1 | tee "$d/describe-up-e2e.txt" || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=controller --tail=200 2>&1 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=gateway --tail=200 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$d/events.txt" 2>&1 || true
          kubectl get agents,agenttasks,agentchannels,modelproviders,toolproviders -n up-e2e -o yaml > "$d/up-e2e-resources.yaml" 2>&1 || true
          kubectl get agentclasses -o yaml > "$d/agentclasses.yaml" 2>&1 || true
          helm list -A > "$d/helm-list.txt" 2>&1 || true
          helm history kaalm -n kaalm-system > "$d/helm-history.txt" 2>&1 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=controller --tail=-1 --prefix > "$d/controller.log" 2>&1 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=controller --tail=-1 --prefix --previous > "$d/controller-previous.log" 2>&1 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=gateway --tail=-1 --prefix > "$d/gateway.log" 2>&1 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=gateway --tail=-1 --prefix --previous > "$d/gateway-previous.log" 2>&1 || true
          kubectl describe pods -n cert-manager > "$d/describe-cert-manager.txt" 2>&1 || true
          ls -la "$d"

      # The attempt number keeps a rerun's upload from clashing with the
      # first attempt's artifact in the same run, and keeps both.
      - name: Upload the test output and diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-upgrade
