# The S21 upgrade e2e: install the previous released chart, load it with
# workloads, upgrade to this build, assert nothing was recreated and nothing
# was lost. The previous release is the newest release tag (the Makefile's
# PREV_CHART_VERSION), and make e2e-upgrade skips when it is older than the
# oldest release this build upgrades from (UPGRADE_FROM_MIN).
#
# Deliberately not part of ci.yml: most PRs cannot affect the upgrade path,
# so this runs only when a PR touches the API, the shipped CRDs, the storage
# migrator, the spec itself, or this file, plus on every release tag. The
# release checklist in RELEASING.md also runs make e2e-upgrade locally
# before tagging.
name: upgrade

on:
  pull_request:
    paths:
      - "api/**"
      - "charts/kaalm/crds/**"
      - "internal/storagemigration/**"
      - "test/upgrade/**"
      - ".github/workflows/upgrade.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  e2e-upgrade:
    name: e2e-upgrade (from the latest release)
    runs-on: ubuntu-26.04
    steps:
      # The full history, tags included: PREV_CHART_VERSION is the newest
      # release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned release binary, not the install script from main: retries
      # ride out transient CDN errors and CI never executes unpinned
      # script content (same reasoning as ci.yml's e2e job).
      - name: Install k3d
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/local/bin/k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
          k3d version

      - name: Install kubectl
        run: |
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/local/bin/kubectl \
            https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Run the upgrade e2e
        run: make e2e-upgrade

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl get crd -o custom-columns='NAME:.metadata.name,STORED:.status.storedVersions' || true
          kubectl describe pods -n kaalm-system || true
          kubectl describe pods -n up-e2e || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=controller --tail=200 || true
          kubectl logs -n kaalm-system -l app.kubernetes.io/component=gateway --tail=200 || true
