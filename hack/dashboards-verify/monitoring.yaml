# A throwaway Prometheus and Grafana for verifying the shipped dashboards
# against a live Kaalm cluster (hack/dashboards-verify.sh, make
# dashboards-verify). Not a production monitoring stack: no persistence, no
# auth beyond the default admin password, a ten-second scrape.
apiVersion: v1
kind: Namespace
metadata:
  name: kaalm-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kaalm-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaalm-monitoring-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaalm-monitoring-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kaalm-monitoring-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kaalm-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kaalm-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
      # One job per component, discovered by the chart's component label and
      # the container port named metrics. This is what a ServiceMonitor on the
      # chart's Services resolves to; the job names carry "kaalm", which the
      # cluster dashboard's job variable matches.
      - job_name: kaalm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kaalm-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: controller|gateway
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: job
            replacement: kaalm-$1
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kaalm-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kaalm-monitoring
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: kaalm-monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.kaalm-monitoring.svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: kaalm
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/kaalm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kaalm-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{name: http, containerPort: 3000}]
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/kaalm}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: kaalm-dashboards}  # created by the script from config/grafana
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kaalm-monitoring
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: 3000}]
